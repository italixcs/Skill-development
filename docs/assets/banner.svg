  <text x="346" y="325" fill="#b5b5b5" font-size="21" font-weight="400" text-anchor="start">Prepare installation and docs</text>
  <text x="786" y="273" fill="#949494" font-size="22" font-weight="400" text-anchor="start">›</text>
  <text x="810" y="273" fill="#b5b5b5" font-size="21" font-weight="400" text-anchor="start">Scope and author</text>
  <text x="786" y="299" fill="#949494" font-size="22" font-weight="400" text-anchor="start">›</text>
  <text x="810" y="299" fill="#b5b5b5" font-size="21" font-weight="400" text-anchor="start">Check behavior and execution risk</text>
  <text x="786" y="325" fill="#949494" font-size="22" font-weight="400" text-anchor="start">›</text>
  <text x="810" y="325" fill="#b5b5b5" font-size="21" font-weight="400" text-anchor="start">Keep the deliverable local</text>
