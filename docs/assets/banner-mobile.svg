  <text x="357" y="343" fill="#b5b5b5" font-size="22" font-weight="400" text-anchor="start">Check execution risk</text>
  <text x="333" y="370" fill="#949494" font-size="23" font-weight="400" text-anchor="start">›</text>
  <text x="357" y="370" fill="#b5b5b5" font-size="22" font-weight="400" text-anchor="start">Keep changes local</text>
