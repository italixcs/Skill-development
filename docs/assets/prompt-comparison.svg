<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="636" viewBox="0 0 1280 636" font-family="DejaVu Sans Mono, monospace">
  <title>Project Memory task-prompt comparison</title>
  <desc>The complete 54-word request with Skill Development and an excerpt from the 309-word manual brief. One blind review judged the delivered results functionally comparable.</desc>
  <rect x="1" y="1" width="1278" height="634" rx="21" fill="#101010" stroke="#444"/>
  <clipPath id="body"><rect x="2" y="2" width="1276" height="632" rx="20"/></clipPath>
  <g clip-path="url(#body)">
  <rect x="1" y="1" width="1278" height="57" rx="0" fill="#1b1b1b"/>
  <path d="M1 57H1279" stroke="#343434"/>
  <circle cx="26" cy="29" r="4" fill="#d9d9d9"/><circle cx="44" cy="29" r="4" fill="#898989"/><circle cx="62" cy="29" r="4" fill="#575757"/>
  <text x="640.0" y="36" fill="#b5b5b5" font-size="20" font-weight="400" text-anchor="middle">~/project-memory / evaluation</text>
  </g>
  <text x="32" y="97" fill="#f3f3f3" font-size="30" font-weight="700" text-anchor="start">Compare two task prompts</text>
  <text x="32" y="126" fill="#b5b5b5" font-size="21" font-weight="400" text-anchor="start">Same Project Memory revision · 13 Nov 2026</text>
  <rect x="32" y="146" width="598" height="415" rx="10" fill="#181818" stroke="#3a3a3a"/>
  <text x="53" y="176" fill="#b5b5b5" font-size="22" font-weight="700" text-anchor="start">MANUAL BRIEF</text>
  <text x="53" y="223" fill="#f3f3f3" font-size="43" font-weight="700" text-anchor="start">309 words</text>
  <text x="609" y="221" fill="#949494" font-size="20" font-weight="400" text-anchor="end">opening excerpt</text>
  <path d="M52 239H610" stroke="#343434"/>
  <text x="53" y="268" fill="#f3f3f3" font-size="21" font-weight="400" text-anchor="start">Improve the supplied Project Memory skill</text>
  <text x="53" y="297" fill="#f3f3f3" font-size="21" font-weight="400" text-anchor="start">for refreshing stale project context. Keep</text>
  <text x="53" y="326" fill="#f3f3f3" font-size="21" font-weight="400" text-anchor="start">it compact, distinguish current evidence</text>
  <text x="53" y="355" fill="#f3f3f3" font-size="21" font-weight="400" text-anchor="start">from historical decisions, preserve explicit</text>
  <text x="53" y="384" fill="#f3f3f3" font-size="21" font-weight="400" text-anchor="start">user constraints, and prevent secret</text>
  <text x="53" y="413" fill="#f3f3f3" font-size="21" font-weight="400" text-anchor="start">leakage. Produce a usable local revision,</text>
  <text x="53" y="442" fill="#f3f3f3" font-size="21" font-weight="400" text-anchor="start">apply it to the supplied fixture, run</text>
  <text x="53" y="471" fill="#f3f3f3" font-size="21" font-weight="400" text-anchor="start">relevant checks, and give a concise handoff.</text>
  <text x="53" y="500" fill="#f3f3f3" font-size="21" font-weight="400" text-anchor="start">Do not publish.</text>
  <rect x="650" y="146" width="598" height="415" rx="10" fill="#181818" stroke="#3a3a3a"/>
  <text x="671" y="176" fill="#b5b5b5" font-size="22" font-weight="700" text-anchor="start">WITH SKILL DEVELOPMENT</text>
  <text x="671" y="223" fill="#f3f3f3" font-size="43" font-weight="700" text-anchor="start">54 words</text>
  <text x="1227" y="221" fill="#949494" font-size="20" font-weight="400" text-anchor="end">full prompt</text>
  <path d="M670 239H1228" stroke="#343434"/>
  <text x="671" y="268" fill="#f3f3f3" font-size="21" font-weight="400" text-anchor="start">Use Skill Development to improve the</text>
  <text x="671" y="297" fill="#f3f3f3" font-size="21" font-weight="400" text-anchor="start">supplied Project Memory skill for refreshing</text>
  <text x="671" y="326" fill="#f3f3f3" font-size="21" font-weight="400" text-anchor="start">stale project context. Keep it compact,</text>
  <text x="671" y="355" fill="#f3f3f3" font-size="21" font-weight="400" text-anchor="start">distinguish current evidence from historical</text>
  <text x="671" y="384" fill="#f3f3f3" font-size="21" font-weight="400" text-anchor="start">decisions, preserve explicit user</text>
  <text x="671" y="413" fill="#f3f3f3" font-size="21" font-weight="400" text-anchor="start">constraints, and prevent secret leakage.</text>
  <text x="671" y="442" fill="#f3f3f3" font-size="21" font-weight="400" text-anchor="start">Produce a usable local revision, apply it to</text>
  <text x="671" y="471" fill="#f3f3f3" font-size="21" font-weight="400" text-anchor="start">the supplied fixture, run relevant checks,</text>
  <text x="671" y="500" fill="#f3f3f3" font-size="21" font-weight="400" text-anchor="start">and give a concise handoff. Do not publish.</text>
  <text x="32" y="591" fill="#f3f3f3" font-size="25" font-weight="700" text-anchor="start">Result  ›  Functionally comparable</text>
  <text x="32" y="616" fill="#b5b5b5" font-size="19" font-weight="400" text-anchor="start">One blind review · Task-prompt word counts</text>
</svg>
